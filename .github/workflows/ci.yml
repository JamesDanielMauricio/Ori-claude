name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Well-known Supabase local-dev defaults — identical on every machine
      # running `supabase start`, safe to commit. See .env.example.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      VITE_API_URL: http://localhost:4000
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # ubuntu-latest runners have Docker preinstalled — this stands up a
      # real local Postgres + GoTrue (Auth) + PostgREST stack, the same one
      # used in local dev, so tests exercise real Supabase Auth end to end
      # rather than a stub.
      - name: Start local Supabase stack
        run: pnpm supabase start

      - name: Run migrations
        run: pnpm db:migrate

      # The WhatsApp dispatcher, served by the local stack's own Edge runtime
      # behind its real gateway, so packages/domain's dispatch-edge.test.ts can
      # call it over HTTP the way the schedule and the office's nudge do.
      # Started in the background; the loop waits until it answers (a CORS
      # preflight, which does no work) and prints its log if it never does.
      - name: Serve Edge Functions
        run: |
          nohup pnpm supabase functions serve > "$RUNNER_TEMP/functions-serve.log" 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/whatsapp-dispatch || true)
            if [ "$code" = "200" ]; then echo "whatsapp-dispatch is served"; exit 0; fi
            sleep 2
          done
          echo "whatsapp-dispatch never answered:"
          cat "$RUNNER_TEMP/functions-serve.log"
          exit 1

      - name: Test
        run: pnpm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The dispatcher's own tests, in Deno — the runtime it ships on: the
      # fake-provider unit tests, plus (DISPATCH_IT=1) the real handler against
      # this job's throwaway database — overlapping runs, a rejected token, a
      # provider error, a network error that repeats the token. After `Test`,
      # so it never overlaps the domain suite's use of the shared settings row.
      # DENO_NO_PACKAGE_JSON keeps Deno from treating the pnpm workspace's
      # package.json as its own configuration.
      - name: Edge function tests
        env:
          DENO_NO_PACKAGE_JSON: "1"
          DISPATCH_IT: "1"
        run: |
          deno check supabase/functions/whatsapp-dispatch/index.ts
          deno test --allow-env --allow-read --allow-net supabase/functions/whatsapp-dispatch/

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @ori/web exec playwright install --with-deps chromium

      - name: End-to-end test
        run: pnpm test:e2e

      # Keeps Playwright's failure evidence (each failed test's
      # error-context.md, a snapshot of what the page showed, plus its
      # trace.zip — see playwright.config.ts's `trace`) — without it a
      # CI-only failure can't be diagnosed, since the runner and its
      # test-results folder are thrown away when the job ends.
      #
      # SECURITY: this repo is public, so anyone signed in to GitHub can
      # download the artifact, and a trace records every request in full —
      # test users' passwords and session tokens included. That is
      # acceptable because everything in it comes from this job's own
      # throwaway local Supabase stack (random test users, the well-known
      # demo keys above), which is destroyed when the job ends — no real
      # account or production data ever reaches this runner. Revisit if
      # e2e is ever pointed at the hosted project here.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop local Supabase stack
        if: always()
        run: pnpm supabase stop
